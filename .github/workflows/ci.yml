name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nullbox.sln

      - name: Format check
        run: dotnet format Nullbox.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Nullbox.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Nullbox.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image (no push)
        run: docker build --tag nullbox:ci .

      - name: Smoke test container health
        run: |
          # ./data is owned by the runner user, not the container's, as on a fresh clone: the entrypoint must fix it.
          mkdir -p data
          docker run --detach --name nullbox-ci --publish 8480:8080 --volume "$PWD/data:/data" nullbox:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nullbox-ci)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8480/healthz
          # The app itself runs unprivileged as 1654 and owns what it wrote.
          test "$(docker exec nullbox-ci awk '/^Uid:/{print $2}' /proc/1/status)" = "1654"
          test "$(stat -c %u data/keys)" = "1654"

      - name: Container logs
        if: always()
        run: docker logs nullbox-ci || true
